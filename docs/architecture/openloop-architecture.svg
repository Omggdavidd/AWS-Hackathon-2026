<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1160" viewBox="0 0 1640 1160" font-family="Segoe UI, Liberation Sans, Arial, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Open Loops system architecture</title>
  <desc id="desc">The browser talks only to the Next.js app on Vercel, which invokes the AgentCore Runtime with SigV4 and reads and writes the DynamoDB ledger. Inside the runtime, an orchestrator runs the Extractor, Investigator and Risk Judge over each thread; separately, a proposed action passes the mayExecute risk gate before the Action Agent produces an effect. An EventBridge Scheduler schedule invokes the same runtime once a day so the agent checks in unattended, and the runtime emits a structured log line per pipeline step to CloudWatch. The ingestion source, Amazon Bedrock and the action sink sit outside the runtime, and packages/shared holds the schemas and the ledger interface both sides import.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0.6 L8,4.5 L0,8.4 z" fill="#637376"/>
    </marker>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.6 L7,4 L0,7.4 z" fill="#177e89"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.6 L7,4 L0,7.4 z" fill="#c2492b"/>
    </marker>
  </defs>

  <rect width="1640" height="1160" fill="#f8fafa"/>

  <!-- title -->
  <text x="60" y="62" font-size="32" font-weight="700" fill="#1d2b2e">Open Loops</text>
  <text x="60" y="92" font-size="15" fill="#637376">A follow-through agent for email and calendar &#8212; system architecture</text>

  <!-- browser -->
  <rect x="60" y="160" width="250" height="92" rx="10" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="185" y="198" font-size="16" font-weight="600" fill="#1d2b2e" text-anchor="middle">Browser</text>
  <text x="185" y="222" font-size="12.5" fill="#637376" text-anchor="middle">judge or user</text>
  <line x1="312" y1="206" x2="344" y2="206" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- web -->
  <rect x="350" y="130" width="790" height="152" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="375" y="166" font-size="17" font-weight="700" fill="#1d2b2e">web/ &#8212; Next.js 16 on Vercel</text>
  <text x="375" y="196" font-size="13" fill="#637376">Dashboard &#183; loop detail with evidence &#183; approvals &#183; activity feed &#183; catch me up &#183; Ask</text>
  <text x="375" y="220" font-size="13" fill="#637376">Server components and server actions only &#8212; credentials never reach the browser</text>
  <text x="375" y="244" font-size="13" fill="#637376">/api/scan &#183; /api/handle &#183; /api/catch-up &#183; /api/ask invoke the runtime and proxy its progress stream</text>
  <text x="375" y="264" font-size="12.5" fill="#637376">A server action that writes checks the request origin; a daily invocation ceiling in the ledger caps the paid paths.</text>

  <!-- web -> ledger -->
  <line x1="1140" y1="180" x2="1236" y2="180" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1188" y="168" font-size="11.5" fill="#637376" text-anchor="middle">reads + writes</text>

  <!-- ledger -->
  <rect x="1240" y="130" width="340" height="590" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="1265" y="166" font-size="17" font-weight="700" fill="#1d2b2e">DynamoDB</text>
  <text x="1265" y="190" font-size="13.5" font-family="Consolas, monospace" fill="#177e89">openloop-ledger</text>
  <line x1="1265" y1="208" x2="1555" y2="208" stroke="#e3e9e8" stroke-width="1.5"/>
  <text x="1265" y="238" font-size="12.5" fill="#637376">One table. The durable state of every</text>
  <text x="1265" y="260" font-size="12.5" fill="#637376">responsibility the agent is tracking.</text>
  <text x="1265" y="300" font-size="13" fill="#637376"><tspan font-weight="600" fill="#1d2b2e">Open loops</tspan> &#8212; five states</text>
  <text x="1265" y="326" font-size="13" fill="#637376"><tspan font-weight="600" fill="#1d2b2e">Evidence</tspan> &#8212; a source id per claim</text>
  <text x="1265" y="352" font-size="13" fill="#637376"><tspan font-weight="600" fill="#1d2b2e">Proposed actions</tspan> &#8212; with risk tier</text>
  <text x="1265" y="378" font-size="13" fill="#637376"><tspan font-weight="600" fill="#1d2b2e">Audit events</tspan> &#8212; the visible trace</text>
  <text x="1265" y="416" font-size="12.5" fill="#637376">Strongly consistent reads. The web app and</text>
  <text x="1265" y="438" font-size="12.5" fill="#637376">the agent share one LedgerStore interface;</text>
  <text x="1265" y="460" font-size="12.5" fill="#637376">local development swaps in a JSON file</text>
  <text x="1265" y="482" font-size="12.5" fill="#637376">with no code change (ADR-0009).</text>
  <text x="1265" y="516" font-size="12.5" font-weight="600" fill="#1d2b2e">Single-table keys</text>
  <text x="1265" y="540" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">USER#id / LOOP#id</text>
  <text x="1265" y="562" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">USER#id / ACTION#id</text>
  <text x="1265" y="584" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">USER#id / AUDIT#at#id</text>
  <text x="1265" y="606" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">LOOP#id / EVIDENCE#at#id</text>
  <text x="1265" y="630" font-size="12" fill="#637376">and two partitions with no user record:</text>
  <text x="1265" y="652" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">RATE#date / INVOCATIONS</text>
  <text x="1265" y="674" font-size="12" font-family="Consolas, monospace" fill="#3f6f77">CONFIG / RUNTIME_LOCK</text>
  <text x="1265" y="702" font-size="12.5" fill="#637376">Only the agent and the web server touch it.</text>

  <!-- web <-> runtime -->
  <line x1="520" y1="286" x2="520" y2="364" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="330" font-size="11.5" fill="#637376" text-anchor="end">invoke (SigV4)</text>
  <line x1="700" y1="364" x2="700" y2="286" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="330" font-size="11.5" fill="#637376">progress stream</text>

  <!-- runtime -->
  <rect x="350" y="370" width="790" height="350" rx="12" fill="#eaf5f5" stroke="#177e89" stroke-width="1.75"/>
  <text x="375" y="406" font-size="17" font-weight="700" fill="#125f68">AgentCore Runtime</text>
  <text x="1115" y="406" font-size="12.5" fill="#3f6f77" text-anchor="end">us-east-1 &#183; CodeZip &#183; arm64 &#183; Node 22</text>
  <text x="375" y="428" font-size="12.5" fill="#3f6f77">Commands: scan &#183; handle &#183; execute &#183; catch_up &#183; ask &#8212; each passes the runtime lock first (ADR-0014)</text>
  <text x="375" y="452" font-size="13" font-weight="600" fill="#1d2b2e">Orchestrator (scan.ts) &#8212; plain code: groups threads, writes the ledger, decides what interrupts you</text>

  <text x="375" y="476" font-size="11.5" font-weight="700" fill="#125f68">SCAN<tspan font-weight="400" fill="#3f6f77">&#160; once per thread. A thread that already has a loop skips extraction: new evidence and transitions only.</tspan></text>

  <rect x="375" y="484" width="230" height="62" rx="8" fill="#fff" stroke="#a3ccd1" stroke-width="1.5"/>
  <text x="490" y="508" font-size="13.5" font-weight="600" fill="#125f68" text-anchor="middle">Extractor</text>
  <text x="490" y="528" font-size="11" fill="#637376" text-anchor="middle">is this a responsibility?</text>
  <line x1="607" y1="515" x2="626" y2="515" stroke="#177e89" stroke-width="1.75" marker-end="url(#arrowT)"/>

  <rect x="630" y="484" width="230" height="62" rx="8" fill="#fff" stroke="#a3ccd1" stroke-width="1.5"/>
  <text x="745" y="508" font-size="13.5" font-weight="600" fill="#125f68" text-anchor="middle">Investigator</text>
  <text x="745" y="528" font-size="11" fill="#637376" text-anchor="middle">is it already resolved?</text>
  <line x1="862" y1="515" x2="881" y2="515" stroke="#177e89" stroke-width="1.75" marker-end="url(#arrowT)"/>

  <rect x="885" y="484" width="230" height="62" rx="8" fill="#fff" stroke="#a3ccd1" stroke-width="1.5"/>
  <text x="1000" y="508" font-size="13.5" font-weight="600" fill="#125f68" text-anchor="middle">Risk Judge</text>
  <text x="1000" y="528" font-size="11" fill="#637376" text-anchor="middle">tier &#183; priority &#183; next action</text>

  <text x="375" y="568" font-size="12" fill="#3f6f77">Tools: search_inbox &#183; get_thread &#183; list_calendar_events &#183; find_open_loops &#183; get_loop_evidence</text>

  <text x="375" y="590" font-size="11.5" font-weight="700" fill="#125f68">ACT<tspan font-weight="400" fill="#3f6f77">&#160; when you press Handle what you can, or approve a high-risk action.</tspan></text>

  <rect x="375" y="598" width="200" height="62" rx="8" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="475" y="622" font-size="13.5" font-weight="600" fill="#1d2b2e" text-anchor="middle">Proposed action</text>
  <text x="475" y="642" font-size="11" fill="#637376" text-anchor="middle">a record in the ledger</text>
  <line x1="577" y1="629" x2="611" y2="629" stroke="#c2492b" stroke-width="1.75" marker-end="url(#arrowR)"/>

  <rect x="615" y="598" width="200" height="62" rx="8" fill="#fdf1ed" stroke="#c2492b" stroke-width="1.75"/>
  <text x="715" y="622" font-size="13.5" font-weight="600" fill="#9c3a22" text-anchor="middle">mayExecute</text>
  <text x="715" y="642" font-size="11" fill="#9c3a22" text-anchor="middle">the risk gate, in code</text>
  <line x1="817" y1="629" x2="851" y2="629" stroke="#c2492b" stroke-width="1.75" marker-end="url(#arrowR)"/>

  <rect x="855" y="598" width="200" height="62" rx="8" fill="#fff" stroke="#a3ccd1" stroke-width="1.5"/>
  <text x="955" y="622" font-size="13.5" font-weight="600" fill="#125f68" text-anchor="middle">Action Agent</text>
  <text x="955" y="642" font-size="11" fill="#637376" text-anchor="middle">writes the concrete effect</text>

  <text x="375" y="682" font-size="12.5" fill="#3f6f77">Every hop is a structured output, parsed with its Zod schema before it is used.</text>
  <text x="375" y="702" font-size="12.5" fill="#3f6f77">High risk never executes without your approval &#8212; enforced in code, not in the prompt.</text>

  <!-- scheduler -->
  <rect x="60" y="300" width="250" height="196" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="85" y="332" font-size="15" font-weight="700" fill="#1d2b2e">EventBridge Scheduler</text>
  <text x="85" y="354" font-size="12" font-family="Consolas, monospace" fill="#177e89">openloop-catch-up</text>
  <text x="85" y="380" font-size="12.5" fill="#637376">Daily at 07:00 America/New_York</text>
  <text x="85" y="398" font-size="12.5" fill="#637376">it sends catch_up, so the agent</text>
  <text x="85" y="416" font-size="12.5" fill="#637376">checks in unattended (ADR-0013).</text>
  <text x="85" y="442" font-size="12.5" fill="#637376">Assumes openloop-scheduler, an</text>
  <text x="85" y="460" font-size="12.5" fill="#637376">IAM role that may invoke this</text>
  <text x="85" y="478" font-size="12.5" fill="#637376">one runtime and nothing else.</text>

  <!-- scheduler -> runtime -->
  <line x1="312" y1="398" x2="344" y2="398" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="328" y="386" font-size="11" fill="#637376" text-anchor="middle">daily</text>

  <!-- cloudwatch -->
  <rect x="60" y="530" width="250" height="160" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="85" y="562" font-size="15" font-weight="700" fill="#1d2b2e">CloudWatch Logs</text>
  <text x="85" y="588" font-size="12.5" fill="#637376">One structured JSON line per</text>
  <text x="85" y="606" font-size="12.5" fill="#637376">pipeline step: thread, role,</text>
  <text x="85" y="624" font-size="12.5" fill="#637376">duration, outcome.</text>
  <text x="85" y="648" font-size="12.5" fill="#637376">AgentCore traces are Python-</text>
  <text x="85" y="666" font-size="12.5" fill="#637376">only, so this log is the trace.</text>

  <!-- runtime -> cloudwatch -->
  <line x1="344" y1="610" x2="314" y2="610" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="329" y="598" font-size="11" fill="#637376" text-anchor="middle">logs</text>

  <!-- runtime -> ledger -->
  <line x1="1140" y1="500" x2="1236" y2="500" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1188" y="488" font-size="11.5" fill="#637376" text-anchor="middle">writes</text>

  <!-- ingestion -> runtime -->
  <path d="M 225 806 L 225 760 L 420 760 L 420 726" fill="none" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="750" font-size="11.5" fill="#637376">threads, oldest first</text>

  <!-- ingestion -->
  <rect x="60" y="810" width="330" height="170" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="85" y="842" font-size="15" font-weight="700" fill="#1d2b2e">Ingestion &#8212; IngestionSource</text>
  <text x="85" y="868" font-size="13.5" font-weight="600" fill="#1d2b2e">FixtureSource</text>
  <text x="85" y="888" font-size="12.5" fill="#637376">demo/seed-inbox.json &#8212; a seeded inbox</text>
  <text x="85" y="906" font-size="12.5" fill="#637376">and calendar, plus a next-morning delta</text>
  <rect x="80" y="926" width="290" height="28" rx="6" fill="none" stroke="#9fb0b0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="94" y="945" font-size="12" fill="#637376">GoogleSource &#8212; reader built, no token</text>

  <!-- runtime -> bedrock -->
  <line x1="615" y1="724" x2="615" y2="806" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="770" font-size="11.5" fill="#637376">model calls</text>

  <!-- bedrock -->
  <rect x="450" y="810" width="330" height="170" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="475" y="842" font-size="15" font-weight="700" fill="#1d2b2e">Amazon Bedrock</text>
  <text x="475" y="868" font-size="12.5" font-family="Consolas, monospace" fill="#177e89">global.anthropic.</text>
  <text x="475" y="886" font-size="12.5" font-family="Consolas, monospace" fill="#177e89">claude-sonnet-4-6</text>
  <text x="475" y="914" font-size="12.5" fill="#637376">Each specialist is a structured-output</text>
  <text x="475" y="932" font-size="12.5" fill="#637376">Strands Agent on this model; output is</text>
  <text x="475" y="950" font-size="12.5" fill="#637376">parsed before the app trusts it.</text>

  <!-- action agent -> sink -->
  <line x1="990" y1="724" x2="990" y2="806" stroke="#637376" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="770" font-size="11.5" fill="#637376">the effect</text>

  <!-- sink -->
  <rect x="840" y="810" width="300" height="170" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="865" y="842" font-size="15" font-weight="700" fill="#1d2b2e">ActionSink</text>
  <text x="865" y="866" font-size="12.5" fill="#637376">The only path from a decision to an</text>
  <text x="865" y="884" font-size="12.5" fill="#637376">effect, and it returns a source ref</text>
  <text x="865" y="902" font-size="12.5" fill="#637376">that is recorded back as evidence.</text>
  <text x="865" y="926" font-size="13" font-weight="600" fill="#1d2b2e">FixtureActionSink <tspan font-weight="400" font-size="12" fill="#637376">draft &#183; event &#183; reminder</tspan></text>
  <rect x="860" y="938" width="260" height="28" rx="6" fill="none" stroke="#9fb0b0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="874" y="957" font-size="12" fill="#637376">Gmail + Calendar sinks &#8212; next</text>

  <!-- legend -->
  <rect x="1240" y="810" width="340" height="170" rx="12" fill="#fff" stroke="#ccd6d5" stroke-width="1.5"/>
  <text x="1265" y="842" font-size="15" font-weight="700" fill="#1d2b2e">Legend</text>
  <line x1="1265" y1="872" x2="1300" y2="872" stroke="#637376" stroke-width="2"/>
  <text x="1312" y="876" font-size="12.5" fill="#637376">built and running</text>
  <line x1="1265" y1="900" x2="1300" y2="900" stroke="#9fb0b0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1312" y="904" font-size="12.5" fill="#637376">built or next &#8212; not wired end to end</text>
  <rect x="1265" y="917" width="35" height="18" rx="5" fill="#fff" stroke="#a3ccd1" stroke-width="1.5"/>
  <text x="1312" y="931" font-size="12.5" fill="#637376">Strands agent on Bedrock</text>
  <rect x="1265" y="945" width="35" height="18" rx="5" fill="#fdf1ed" stroke="#c2492b" stroke-width="1.5"/>
  <text x="1312" y="959" font-size="12.5" fill="#637376">safety gate, enforced in code</text>

  <!-- shared band -->
  <rect x="60" y="1020" width="1520" height="88" rx="10" fill="#f6f8f8" stroke="#e3e9e8" stroke-width="1.5"/>
  <text x="85" y="1048" font-size="14" font-weight="700" fill="#1d2b2e">packages/shared &#8212; the contract both sides import</text>
  <text x="85" y="1070" font-size="12.5" fill="#637376">Zod schemas for every record and agent output &#183; LedgerStore (local JSON file or DynamoDB) &#183; state transitions &#183; mayExecute risk policy &#183; ActionSink</text>
  <text x="85" y="1090" font-size="12.5" fill="#637376">web/ and agent/ never hand-write a record shape: every record crossing a boundary is a parsed Zod type.</text>

  <text x="820" y="1136" font-size="13" font-style="italic" fill="#637376" text-anchor="middle">Models interpret evidence. The application owns the state, the transitions and the safety gate.</text>
</svg>
