name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-check:
    name: context-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify shared project context is well-formed
        run: python3 scripts/check_context.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workspace-checks:
    name: workspace-checks
    runs-on: ubuntu-latest
    # The ledger contract suite runs against this instead of the real table, so a PR with no AWS
    # credentials still proves the DynamoDB store. In-memory, so it starts empty on every run.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      # Dummy credentials: DynamoDB Local grants everything, but it rejects an access key id that
      # is not alphanumeric, and without -sharedDb the table belongs to the key and region that
      # created it, so the create step and the test run must use the same three values.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: dynamodblocal
      AWS_SECRET_ACCESS_KEY: dynamodblocal
      DYNAMODB_ENDPOINT: http://localhost:8000
      OPENLOOP_DYNAMO_TEST_TABLE: openloop-ledger-test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # A bare GET answers 400 once the port is listening; the image carries no health command.
      - name: Wait for DynamoDB Local
        run: timeout 60 bash -c 'until curl -s -o /dev/null "$DYNAMODB_ENDPOINT"; do sleep 1; done'
      - name: Create the ledger table on DynamoDB Local
        run: pnpm --filter @openloop/ledger-dynamo create-table
        env:
          OPENLOOP_LEDGER_TABLE: ${{ env.OPENLOOP_DYNAMO_TEST_TABLE }}
      # Fails on a skipped test file (root vitest.config.ts), so a suite cannot opt out quietly.
      - run: pnpm test
      # Catches what lint, typecheck and tests cannot: a route that fails to
      # compile, a server/client boundary violation, a bad page export.
      - run: pnpm --filter @openloop/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Job names are referenced as required checks in the main branch ruleset; keep them stable.
