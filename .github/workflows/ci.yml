name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-check:
    name: context-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify shared project context is well-formed
        run: python3 scripts/check_context.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Add build / test / lint jobs per workspace as code lands.
  # Keep job names stable: they are referenced as required checks in the main branch ruleset.
