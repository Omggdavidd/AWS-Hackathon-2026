name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-check:
    name: context-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify shared project context is well-formed
        run: python3 scripts/check_context.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workspace-checks:
    name: workspace-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Catches what lint, typecheck and tests cannot: a route that fails to
      # compile, a server/client boundary violation, a bad page export.
      - run: pnpm --filter @openloop/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Job names are referenced as required checks in the main branch ruleset; keep them stable.
